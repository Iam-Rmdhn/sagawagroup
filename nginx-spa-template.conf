# ============================================
# NGINX Configuration untuk Single Page Application (SPA)
# Template optimal untuk production deployment
# ============================================

# HTTP Server - Redirect ke HTTPS
server {
    listen 80;
    server_name sagawagroup.id www.sagawagroup.id;
    
    # Let's Encrypt ACME challenge (untuk SSL certificate)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect semua traffic HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Main Configuration
server {
    listen 443 ssl http2;
    server_name sagawagroup.id www.sagawagroup.id;
    
    # ============================================
    # SSL Configuration (Update path sesuai certificate Anda)
    # ============================================
    ssl_certificate /etc/letsencrypt/live/sagawagroup.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sagawagroup.id/privkey.pem;
    
    # SSL Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # ============================================
    # Document Root - Update path ke folder build Anda
    # ============================================
    root /var/www/sagawagroup/dist;
    index index.html;
    
    # ============================================
    # Logging
    # ============================================
    access_log /var/log/nginx/sagawagroup_access.log;
    error_log /var/log/nginx/sagawagroup_error.log warn;
    
    # ============================================
    # Basic Server Settings
    # ============================================
    server_tokens off;                    # Sembunyikan versi Nginx
    client_max_body_size 10M;            # Max upload size
    client_body_timeout 30s;             # Timeout untuk request body
    client_header_timeout 30s;           # Timeout untuk request header
    
    # ============================================
    # Gzip Compression - Kompres file untuk transfer lebih cepat
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;                # Minimal size file yang di-compress (1KB)
    gzip_comp_level 6;                   # Level compression (1-9, 6 optimal)
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/opentype
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # ============================================
    # Security Headers - Proteksi dari berbagai serangan
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;                    # Cegah clickjacking
    add_header X-XSS-Protection "1; mode=block" always;               # XSS protection
    add_header X-Content-Type-Options "nosniff" always;               # Cegah MIME sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # Force HTTPS
    
    # ============================================
    # CACHE STRATEGY
    # ============================================
    
    # 1. HTML Files - NO CACHE (Selalu ambil versi terbaru)
    # Agar setiap deploy langsung terlihat tanpa hard refresh
    location ~* \.html$ {
        expires -1;                                    # Expired di masa lalu
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;                                      # Disable ETag
        if_modified_since off;                         # Disable If-Modified-Since
    }
    
    # 2. CSS & JavaScript - Cache 30 hari
    # File ini biasanya punya hash di nama file (e.g., app.abc123.js)
    location ~* \.(css|js|mjs)$ {
        expires 30d;                                   # Cache 30 hari
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;                                # Tidak perlu log untuk static files
    }
    
    # 3. Images - Cache 30 hari
    # Format: jpg, jpeg, png, gif, webp, svg, ico
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|bmp|tiff)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept-Encoding" always;      # Vary header untuk compressed images
        access_log off;
    }
    
    # 4. Fonts - Cache 1 tahun (fonts jarang berubah)
    # Format: woff, woff2, ttf, otf, eot
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;  # CORS untuk fonts
        access_log off;
    }
    
    # 5. Media Files - Cache 30 hari
    # Format: mp4, mp3, webm, ogg, pdf, zip
    location ~* \.(mp4|mp3|webm|ogg|avi|mov|pdf|zip|tar|gz)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }
    
    # 6. Manifest & Service Worker - NO CACHE
    # File ini harus selalu fresh untuk PWA
    location ~* \.(json|webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    
    location ~* (service-worker\.js|sw\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    
    # ============================================
    # Special Files
    # ============================================
    
    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    
    # Robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
        expires 7d;
    }
    
    # Sitemap
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }
    
    # ============================================
    # Security - Deny Access ke File Sensitif
    # ============================================
    
    # Deny akses ke hidden files (.htaccess, .git, .env, dll)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny akses ke backup dan config files
    location ~* \.(bak|backup|config|sql|log|sh|inc|swp|dist|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================
    # SINGLE PAGE APPLICATION (SPA) ROUTING
    # ============================================
    # Semua request yang tidak match dengan file static akan di-route ke index.html
    # Ini penting untuk aplikasi Vue, React, Angular, dll
    
    location / {
        # Try file, kemudian directory, kemudian fallback ke index.html
        try_files $uri $uri/ /index.html;
        
        # Security headers untuk halaman utama
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # ============================================
    # API Proxy (Optional - jika backend API ada di server yang sama)
    # ============================================
    # Uncomment jika Anda punya backend API di localhost
    
    # location /api/ {
    #     proxy_pass http://localhost:5000/api/;      # Port backend API Anda
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    #     
    #     # Timeout settings
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 60s;
    #     proxy_read_timeout 60s;
    #     
    #     # No cache untuk API responses
    #     add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # }
    
    # ============================================
    # Error Pages
    # ============================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Custom error page locations (optional)
    location = /404.html {
        internal;
    }
    
    location = /50x.html {
        internal;
    }
}

# ============================================
# Rate Limiting (Optional - untuk proteksi dari abuse)
# ============================================
# Tambahkan di luar block server (di top level nginx.conf atau di http block)

# Rate limit zones - uncomment jika diperlukan
# limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
# limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Kemudian gunakan di dalam location block:
# limit_req zone=general burst=20 nodelay;
